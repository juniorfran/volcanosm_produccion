<!-- Topbar -->
<div class="vsm-topbar d-none d-lg-block">
  <div class="container d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center" style="gap:1.4rem;">
      <span><i class="fa fa-envelope text-primary mr-2"></i>{{ barra_principal.email_contacto }}</span>
      <span><i class="fa fa-phone-alt text-primary mr-2"></i>{{ barra_principal.numero_contacto }}</span>
    </div>
    <div class="d-flex align-items-center" style="gap:.2rem;">
      <a class="px-2" target="_blank" href="{{ barra_principal.url_facebook }}"><i class="fab fa-facebook-f"></i></a>
      <a class="px-2" target="_blank" href="{{ barra_principal.url_instagram }}"><i class="fab fa-instagram"></i></a>
      <a class="px-2" target="_blank" href="{{ barra_principal.url_youtube }}"><i class="fab fa-youtube"></i></a>
      <a class="pl-3" href="{% url 'login' %}"><i class="fa fa-user mr-1"></i> Iniciar sesión</a>
    </div>
  </div>
</div>
