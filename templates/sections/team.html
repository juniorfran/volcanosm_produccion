<!-- Equipo -->
<section class="vsm-section vsm-bleed">
  <div class="vsm-wrap">
    <div class="vsm-head">
      <span class="vsm-eyebrow">Nuestro equipo</span>
      <h2>Guías capacitados y apasionados</h2>
    </div>
    <div class="vsm-team-grid">
      {% for m in teams_bar|slice:":4" %}
      <div class="vsm-member">
        <div class="vsm-member__img">{% if m.imagen_url %}<img src="{{ m.imagen_url }}" alt="{{ m.team_nombre }}">{% endif %}</div>
        <div class="vsm-member__body">
          <h5>{{ m.team_nombre }}</h5>
          <p>{{ m.team_job }}</p>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
