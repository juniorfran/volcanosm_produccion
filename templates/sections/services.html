<!-- Servicios -->
<section class="vsm-section vsm-section--tint vsm-bleed">
  <div class="vsm-wrap">
    <div class="vsm-head">
      <span class="vsm-eyebrow">Servicios</span>
      <h2>Tours, alojamiento y mucha diversión</h2>
    </div>
    <div class="vsm-features">
      {% for service in services %}
      <div class="vsm-feature">
        <div class="vsm-feature__ico">
          {% if service.imagen_url %}<img src="{{ service.imagen_url }}" alt="{{ service.services_name }}">{% else %}<i class="{{ service.services_ico_tag|default:'fa fa-leaf' }}"></i>{% endif %}
        </div>
        <h5>{{ service.services_name }}</h5>
        <p>{{ service.services_description }}</p>
      </div>
      {% empty %}
      <p class="text-center text-muted">Servicios disponibles próximamente.</p>
      {% endfor %}
    </div>
  </div>
</section>
