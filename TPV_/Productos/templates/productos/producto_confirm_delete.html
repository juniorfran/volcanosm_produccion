{% extends 'base_utilities.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0 text-danger"><i class="bi bi-trash"></i> Eliminar producto</h1>
  <a href="{% url 'producto_list' %}" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left"></i> Volver
  </a>
</div>

<div class="card border-danger">
  <div class="card-body">
    <p class="mb-3">
      ¿Estás seguro de eliminar el producto
      <strong>«{{ producto.nombre }}»</strong>? Esta acción no se puede deshacer.
    </p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">
        <i class="bi bi-trash"></i> Sí, eliminar
      </button>
      <a href="{% url 'producto_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
